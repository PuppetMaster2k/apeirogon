[package]
name = "a7n-platform"
description = "Native desktop backends for the Apeirogon software KVM"
readme = "../../README.md"
keywords = ["kvm", "desktop", "input-sharing", "clipboard"]
categories = ["network-programming", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# Drop the icon sources and the Linux-only files nothing embeds.
exclude = ["icons/gen.py", "icons/svg", "icons/macos/AppIcon.icns", "icons/linux/hicolor/scalable", "icons/linux/hicolor/[1-9]*x[1-9]*/status"]

[dependencies]
png = { workspace = true, optional = true }
tiny-skia.workspace = true
serde.workspace = true
netdev.workspace = true
a7n-core.workspace = true
a7n-proto.workspace = true
directories.workspace = true
interprocess.workspace = true
notify-rust.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ashpd.workspace = true
futures-util.workspace = true
reis.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
png.workspace = true
widestring.workspace = true
windows.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true

[dev-dependencies]
png.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
fx-preview = ["dep:png"]
tray = ["dep:tray-icon", "dep:png"]

[[example]]
name = "fx_preview"
required-features = ["fx-preview"]

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies.tray-icon]
workspace = true
optional = true
