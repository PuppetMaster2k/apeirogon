[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/PuppetMaster2k/apeirogon"
rust-version = "1.85"

[workspace.dependencies]
a7n-proto    = { path = "crates/a7n-proto" }
a7n-ipc      = { path = "crates/a7n-ipc" }
a7n-core     = { path = "crates/a7n-core" }
a7n-platform = { path = "crates/a7n-platform" }
thiserror           = "2"
prost               = "0.14"
prost-build         = "0.14"
protoc-bin-vendored = "3.3"
rcgen               = "0.14"
ring                = "0.17"
sha2                = "0.11"
curve25519-dalek    = "4.1"
hkdf                = "0.13"
hmac                = "0.13"
rand_core           = { version = "0.6", features = ["getrandom"] }
zeroize             = { version = "1.8", features = ["derive"] }
x509-parser         = "0.18"
toml                = "1"
serde               = { version = "1", features = ["derive"] }
directories         = "6"
interprocess        = { version = "2.4", features = ["tokio"] }
rustix              = { version = "1", features = ["fs", "pipe", "process", "event", "system", "time"] }
x11rb               = { version = "0.14", default-features = false, features = ["xinput", "xtest", "xfixes"] }
serde_json          = "1"
ashpd               = { version = "0.13", default-features = false, features = ["tokio", "clipboard", "input_capture", "remote_desktop", "screencast"] }
reis                = { version = "0.7", features = ["tokio"] }
wayland-client      = "0.31"
wayland-protocols   = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
futures-util        = { version = "0.3", default-features = false }
widestring          = "1"
windows-sys         = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
anyhow              = "1"
mdns-sd             = { version = "0.21.6", default-features = false, features = ["async"] }
clap                = { version = "4", features = ["derive"] }
ratatui             = "0.29"
crossterm           = "0.29"
tempfile            = "3"
quinn               = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls              = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio               = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSObject", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "objc2-core-graphics"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDate", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGDirectDisplay", "CGDisplayConfiguration", "CGGeometry", "CGError", "libc"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
