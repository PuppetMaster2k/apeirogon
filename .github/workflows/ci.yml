name: CI
on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        # A release PR only bumps versions of code main already checked; it needs
        # just the lockfile check. The job still runs so the required matrix
        # checks report (a job-level `if` would skip them as one unnamed check).
        env:
            RELEASE_PR: ${{ github.head_ref == 'release-please--branches--main' }}
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            # --locked fails on a stale Cargo.lock, as the release build does,
            # so a release PR without its lockfile commit cannot merge.
            - if: env.RELEASE_PR == 'true'
              run: cargo metadata --locked --format-version 1 > /dev/null
            - if: env.RELEASE_PR != 'true'
              uses: Swatinem/rust-cache@v2
            - if: env.RELEASE_PR != 'true'
              run: cargo fmt --all --check
            - if: env.RELEASE_PR != 'true'
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
            - if: env.RELEASE_PR != 'true'
              run: cargo test --workspace --locked

    pr-title:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

