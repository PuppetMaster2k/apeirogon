name: CI
on:
    pull_request:
    push:
        branches: [main]

# Strict up-to-date PR checks already tested the merge; main only warms the
# Rust cache, because PRs can read main's cache but not each other's.
# The release lockfile push supersedes the initial opened run.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    cache-warm:
        if: github.event_name == 'push'
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo build --workspace --all-targets --locked

    check:
        if: github.event_name == 'pull_request'
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        # A release PR only bumps versions of code main already checked; it needs
        # just the lockfile check. The job still runs so the required matrix
        # checks report (a job-level `if` would skip them as one unnamed check).
        env:
            RELEASE_PR: ${{ github.head_ref == 'release-please--branches--main' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            # Keep required matrix checks green for docs; never skip the job.
            # Code/config paths take precedence over documentation patterns.
            - name: Detect docs-only changes
              id: changes
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
                  docs_only=true
                  while IFS= read -r -d '' path; do
                      case "$path" in
                          .github/*|Cargo.*|*.rs|*.toml|*.yml|*.yaml) docs_only=false; break ;;
                          *.md|docs/*|*.png|*.svg|LICENSE) ;;
                          *) docs_only=false; break ;;
                      esac
                  done < "$RUNNER_TEMP/changed-files"
                  echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
            - if: steps.changes.outputs.docs_only != 'true'
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            # --locked fails on a stale Cargo.lock, as the release build does,
            # so a release PR without its lockfile commit cannot merge.
            - if: steps.changes.outputs.docs_only != 'true' && env.RELEASE_PR == 'true'
              shell: bash
              run: cargo metadata --locked --format-version 1 > /dev/null
            - if: steps.changes.outputs.docs_only != 'true' && env.RELEASE_PR != 'true'
              uses: Swatinem/rust-cache@v2
              with:
                  save-if: false
            - if: steps.changes.outputs.docs_only != 'true' && env.RELEASE_PR != 'true'
              run: cargo fmt --all --check
            - if: steps.changes.outputs.docs_only != 'true' && env.RELEASE_PR != 'true'
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
            - if: steps.changes.outputs.docs_only != 'true' && env.RELEASE_PR != 'true'
              run: cargo test --workspace --locked

    pr-title:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

