name: CI
on:
    pull_request:
    push:
        branches: [main]

# Strict up-to-date PR checks already tested the merge; main only warms the
# Rust cache, because PRs can read main's cache but not each other's.
# The release lockfile push supersedes the initial opened run.
# Skipped matrix jobs report one unnamed check, so ci-ok is the single
# required check whether the Rust matrix runs or documentation skips it.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    cache-warm:
        if: github.event_name == 'push'
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo build --workspace --all-targets --locked

    # Detect paths once so documentation changes need no matrix runners.
    changes:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.code == 'true' }}
            release_pr: ${{ github.head_ref == 'release-please--branches--main' }}
        steps:
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  predicate-quantifier: every
                  filters: |
                      rust:
                          - '!**/*.md'
                          - '!docs/**'
                          - '!**/*.png'
                          - '!**/*.svg'
                          - '!LICENSE'
                      # Code/config wins even inside documentation paths.
                      code:
                          - '{.github/**,Cargo.*,**/*.{rs,toml,yml,yaml}}'

    check:
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        strategy:
            # One OS failing must not hide the other results.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        # A release PR only bumps versions of code main already checked;
        # it needs just the lockfile check.
        env:
            RELEASE_PR: ${{ needs.changes.outputs.release_pr }}
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            # --locked fails on a stale Cargo.lock, as the release build does,
            # so a release PR without its lockfile commit cannot merge.
            - if: env.RELEASE_PR == 'true'
              shell: bash
              run: cargo metadata --locked --format-version 1 > /dev/null
            - if: env.RELEASE_PR != 'true'
              uses: Swatinem/rust-cache@v2
              with:
                  save-if: false
            - if: env.RELEASE_PR != 'true'
              run: cargo fmt --all --check
            - if: env.RELEASE_PR != 'true'
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
            - if: env.RELEASE_PR != 'true'
              run: cargo test --workspace --locked

    # Read individual jobs: the matrix aggregate can hide cancelled legs.
    ci-ok:
        needs: [changes, check]
        if: always() && github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            actions: read
        steps:
            - shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Partial reruns retain successful jobs from earlier attempts.
                  jobs=$(for ((attempt = 1; attempt <= GITHUB_RUN_ATTEMPT; attempt++)); do
                      gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs" --paginate || exit 1
                  done)
                  failed=$(jq -sr '
                      [.[].jobs[] | select(.name == "changes" or .name == "check" or (.name | startswith("check (")))]
                      | if length == 0 then error("no prerequisite jobs found") else . end
                      | group_by(.name)
                      | map(max_by([.run_attempt // 0, .id]))
                      | .[]
                      | select(.conclusion != "success" and .conclusion != "skipped")
                      | "\(.name): \(.conclusion // "pending")"
                  ' <<< "$jobs")
                  if [[ -n "$failed" ]]; then
                      printf '%s\n' "$failed"
                      exit 1
                  fi

    pr-title:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

