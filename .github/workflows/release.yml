# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        concurrency: release-please
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  # PRs opened with github.token do not trigger CI.
                  token: ${{ secrets.RELEASE_TOKEN }}
            # GenericToml tags scalar values, so filters on package names cannot match.
            - uses: actions/checkout@v4
              if: steps.release.outputs.prs_created == 'true'
              with:
                  ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
                  token: ${{ secrets.RELEASE_TOKEN }}
            - uses: dtolnay/rust-toolchain@stable
              if: steps.release.outputs.prs_created == 'true'
            - name: Update workspace lockfile in release PR
              if: steps.release.outputs.prs_created == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  cargo update --workspace
                  if git diff --quiet -- Cargo.lock; then
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add Cargo.lock
                  git commit -s -m "chore: update release lockfile"
                  git push

    build:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                    - os: macos-latest
                      target: aarch64-apple-darwin
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            # Unsigned archives; signing is tracked in #28.
            - uses: taiki-e/upload-rust-binary-action@v1
              with:
                  bin: apeirogond,a7n
                  target: ${{ matrix.target }}
                  locked: true
                  include: LICENSE
                  archive: apeirogon-$tag-$target
                  tar: unix
                  zip: windows
                  checksum: sha256
                  ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
                  token: ${{ secrets.RELEASE_TOKEN }}

    finalize:
        needs: [release-please, build]
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ needs.release-please.outputs.tag_name }}
        steps:
            - run: gh release edit "$TAG" --draft=false --latest
