# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        concurrency: release-please
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            publish_enabled: ${{ steps.publish-token.outputs.enabled }}
        steps:
            - name: Check crates.io token availability
              id: publish-token
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              run: echo "enabled=${{ env.CARGO_REGISTRY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
            # Runs with github.token on purpose: its version-bump commit lacks the
            # Cargo.lock update and must not trigger CI (it would fail --locked).
            # The lockfile commit below is pushed with RELEASE_TOKEN, so CI runs
            # once, on the commit that is actually merged.
            - uses: googleapis/release-please-action@v5
              id: release
            # GenericToml tags scalar values, so filters on package names cannot match.
            - uses: actions/checkout@v7
              if: steps.release.outputs.prs_created == 'true'
              with:
                  ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
                  token: ${{ secrets.RELEASE_TOKEN }}
            - uses: dtolnay/rust-toolchain@stable
              if: steps.release.outputs.prs_created == 'true'
            - name: Update workspace lockfile in release PR
              if: steps.release.outputs.prs_created == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  cargo update --workspace
                  if git diff --quiet -- Cargo.lock; then
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add Cargo.lock
                  git commit -s -m "chore: update release lockfile"
                  git push

    build:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                    - os: macos-latest
                      target: aarch64-apple-darwin
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libssl-dev
            # Unsigned archives; signing is tracked in #28.
            - uses: taiki-e/upload-rust-binary-action@v1
              with:
                  bin: apeirogond,a7n,a7n-gui
                  target: ${{ matrix.target }}
                  locked: true
                  include: LICENSE
                  archive: apeirogon-$tag-$target
                  tar: unix
                  zip: windows
                  checksum: sha256
                  ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
                  token: ${{ secrets.RELEASE_TOKEN }}

            - uses: taiki-e/install-action@v2
              if: runner.os == 'Linux'
              with:
                  tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
            - name: Build Linux packages
              if: runner.os == 'Linux'
              run: |
                  cargo build --release --locked -p apeirogond -p a7n -p a7n-gui
                  cargo deb -p apeirogond --no-build
                  cargo generate-rpm -p crates/apeirogond
            - name: Upload Linux packages
              if: runner.os == 'Linux'
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                  TAG: ${{ needs.release-please.outputs.tag_name }}
              run: gh release upload "$TAG" target/debian/*.deb target/generate-rpm/*.rpm

    publish:
        needs: [release-please, build]
        if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.publish_enabled == 'true'
        runs-on: ubuntu-latest
        env:
            CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
            - uses: dtolnay/rust-toolchain@stable
            - name: Install Linux build dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libssl-dev
            - name: Publish crates in dependency order
              env:
                  TAG: ${{ needs.release-please.outputs.tag_name }}
              # Skips versions already on crates.io, so a re-run after a failure
              # (e.g. the new-crate rate limit) continues where it stopped.
              run: |
                  set -euo pipefail
                  version="${TAG#v}"
                  for crate in a7n-proto a7n-core a7n-platform a7n-ipc apeirogond a7n a7n-gui; do
                      if curl -sfo /dev/null -A "apeirogon-release (github.com/${{ github.repository }})" \
                          "https://crates.io/api/v1/crates/$crate/$version"; then
                          echo "$crate $version already published"
                          continue
                      fi
                      cargo publish --locked -p "$crate"
                  done

    finalize:
        needs: [release-please, build, publish]
        if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ needs.release-please.outputs.tag_name }}
        steps:
            - run: gh release edit "$TAG" --draft=false --latest

    channels:
        needs: [release-please, finalize]
        if: always() && needs.finalize.result == 'success'
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            TAG: ${{ needs.release-please.outputs.tag_name }}
        steps:
            # The runner context is not available in job-level env.
            - run: echo "OUTPUT=$RUNNER_TEMP/channels" >> "$GITHUB_ENV"
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
                  persist-credentials: false
            - name: Render package channels
              run: packaging/render.sh "$TAG" "$OUTPUT"
            - name: Update Homebrew tap and Scoop bucket
              run: |
                  set -euo pipefail
                  gh auth setup-git
                  git config --global user.name 'github-actions[bot]'
                  git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  for channel in homebrew-tap scoop-bucket; do
                      checkout="$RUNNER_TEMP/$channel"
                      git clone --branch main "https://github.com/PuppetMaster2k/$channel.git" "$checkout"
                      if [ "$channel" = homebrew-tap ]; then
                          file=Formula/apeirogon.rb
                      else
                          file=bucket/apeirogon.json
                      fi
                      mkdir -p "$checkout/$(dirname "$file")"
                      cp "$OUTPUT/$(basename "$file")" "$checkout/$file"
                      git -C "$checkout" add -- "$file"
                      if ! git -C "$checkout" diff --cached --quiet; then
                          git -C "$checkout" commit -s -m "apeirogon ${TAG#v}"
                          git -C "$checkout" push origin main
                      fi
                  done
            - name: Check AUR key availability
              id: aur-key
              env:
                  AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
              run: echo "enabled=${{ env.AUR_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"
            - name: Update AUR package
              if: steps.aur-key.outputs.enabled == 'true'
              env:
                  AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
              run: |
                  set -euo pipefail
                  eval "$(ssh-agent -s)"
                  trap 'ssh-agent -k' EXIT
                  printf '%s\n' "$AUR_SSH_KEY" | ssh-add -
                  # Ed25519 fingerprint published at https://aur.archlinux.org/:
                  # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
                  echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$RUNNER_TEMP/aur_known_hosts"
                  export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/aur_known_hosts"
                  checkout="$RUNNER_TEMP/apeirogon-bin"
                  git clone ssh://aur@aur.archlinux.org/apeirogon-bin.git "$checkout"
                  cp "$OUTPUT/PKGBUILD" "$OUTPUT/.SRCINFO" "$checkout/"
                  git -C "$checkout" add -- PKGBUILD .SRCINFO
                  if ! git -C "$checkout" diff --cached --quiet; then
                      git -C "$checkout" commit -s -m "apeirogon ${TAG#v}"
                      git -C "$checkout" push
                  fi
