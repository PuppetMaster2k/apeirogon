# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        concurrency: release-please
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            publish_enabled: ${{ steps.publish-token.outputs.enabled }}
        steps:
            - name: Check crates.io token availability
              id: publish-token
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              run: echo "enabled=${{ env.CARGO_REGISTRY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  # PRs opened with github.token do not trigger CI.
                  token: ${{ secrets.RELEASE_TOKEN }}
            # GenericToml tags scalar values, so filters on package names cannot match.
            - uses: actions/checkout@v7
              if: steps.release.outputs.prs_created == 'true'
              with:
                  ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
                  token: ${{ secrets.RELEASE_TOKEN }}
            - uses: dtolnay/rust-toolchain@stable
              if: steps.release.outputs.prs_created == 'true'
            - name: Update workspace lockfile in release PR
              if: steps.release.outputs.prs_created == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  cargo update --workspace
                  if git diff --quiet -- Cargo.lock; then
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add Cargo.lock
                  git commit -s -m "chore: update release lockfile"
                  git push

    build:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                    - os: macos-latest
                      target: aarch64-apple-darwin
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libssl-dev
            # Unsigned archives; signing is tracked in #28.
            - uses: taiki-e/upload-rust-binary-action@v1
              with:
                  bin: apeirogond,a7n,a7n-gui
                  target: ${{ matrix.target }}
                  locked: true
                  include: LICENSE
                  archive: apeirogon-$tag-$target
                  tar: unix
                  zip: windows
                  checksum: sha256
                  ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
                  token: ${{ secrets.RELEASE_TOKEN }}

            - uses: taiki-e/install-action@v2
              if: runner.os == 'Linux'
              with:
                  tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
            - name: Build Linux packages
              if: runner.os == 'Linux'
              run: |
                  cargo build --release --locked -p apeirogond -p a7n -p a7n-gui
                  cargo deb -p apeirogond --no-build
                  cargo generate-rpm -p crates/apeirogond
            - name: Upload Linux packages
              if: runner.os == 'Linux'
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
                  TAG: ${{ needs.release-please.outputs.tag_name }}
              run: gh release upload "$TAG" target/debian/*.deb target/generate-rpm/*.rpm

    publish:
        needs: [release-please, build]
        if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.publish_enabled == 'true'
        runs-on: ubuntu-latest
        env:
            CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
            - uses: dtolnay/rust-toolchain@stable
            - name: Install Linux build dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libssl-dev
            - name: Publish crates in dependency order
              run: |
                  cargo publish --locked -p a7n-proto
                  cargo publish --locked -p a7n-core
                  cargo publish --locked -p a7n-platform
                  cargo publish --locked -p a7n-ipc
                  cargo publish --locked -p apeirogond
                  cargo publish --locked -p a7n
                  cargo publish --locked -p a7n-gui

    finalize:
        needs: [release-please, build, publish]
        if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ needs.release-please.outputs.tag_name }}
        steps:
            - run: gh release edit "$TAG" --draft=false --latest
