# build/ci prefixes keep dependency updates from triggering a release on
# their own; a release ships them when the release PR is merged.
version: 2
updates:
    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
          include: scope
      groups:
          cargo-minor-patch:
              update-types: [minor, patch]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
          include: scope
      groups:
          actions-minor-patch:
              update-types: [minor, patch]
